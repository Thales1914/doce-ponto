name: doceponto-production

# Arquivo independente: não combinar com docker-compose.yml.
# Implantação direta em servidor Docker: o frontend cuida do HTTPS do domínio.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  api:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_NOME: ${ADMIN_NOME:-Administradora}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL}
      ADMIN_SENHA: ${ADMIN_SENHA:?Configure ADMIN_SENHA}
      APP_TIMEZONE: America/Sao_Paulo
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Configure PUBLIC_ORIGIN com a URL HTTPS do site}
      TRUST_PROXY: '1'
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 35s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${PUBLIC_ORIGIN:?Configure PUBLIC_ORIGIN com a URL HTTPS do site}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8081/health]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
